<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Facebook – Connexion</title>
<style>
  :root {
    --fb-blue: #1877f2;
    --fb-blue-hover: #166fe5;
    --fb-green: #42b72a;
    --fb-green-hover: #36a420;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #606770;
    --border: #dddfe2;
    --input-bg: #f5f6f7;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:Helvetica,Arial,sans-serif; }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .fb-logo {
    margin-bottom: 20px;
    text-align: center;
  }
  .fb-logo svg {
    width: 200px;
    height: 70px;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 396px;
    padding: 18px 16px 24px;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
    text-align: center;
  }
  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.34;
  }
  form { text-align: left; }
  .field-group {
    margin-bottom: 12px;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    color: var(--text);
    transition: .2s;
  }
  input:focus {
    outline: none;
    border-color: var(--fb-blue);
    background: var(--card);
    box-shadow: 0 0 0 2px rgba(24,119,242,0.2);
  }
  input::placeholder { color: #8a8d91; }
  .btn-fb {
    width: 100%;
    padding: 14px;
    background: var(--fb-blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }
  .btn-fb:hover {
    background: var(--fb-blue-hover);
  }
  .btn-fb:active {
    background: #1a6ed8;
  }
  .forgot-link {
    display: block;
    text-align: center;
    margin: 14px 0 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--fb-blue);
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0 18px;
  }
  .btn-signup {
    display: inline-block;
    padding: 12px 24px;
    background: var(--fb-green);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: .2s;
  }
  .btn-signup:hover {
    background: var(--fb-green-hover);
  }
  .footer-text {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: #737373;
  }
  .footer-text a {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover { text-decoration: underline; }
  .lang-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 12px;
    margin-top: 24px;
    max-width: 500px;
    font-size: 12px;
    color: #737373;
  }
  .lang-bar a {
    color: #737373;
    text-decoration: none;
  }
  .lang-bar a:hover { text-decoration: underline; }
  .lang-bar .active { color: #737373; }
  .footer-divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }
  .copyright {
    font-size: 11px;
    color: #737373;
    margin-top: 8px;
  }
  /* Spinner */
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-fb.loading .spinner { display: inline-block; }
  .btn-fb.loading .btn-text { display: none; }
</style>
</head>
